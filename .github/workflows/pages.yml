name: Deploy site to GitHub Pages

# Old address: refaqt.github.io/refaqt-web/. Turn this off when refaqt.com runs on
# Cloudflare Pages. See docs/decisions/2026-11-14_host-on-cloudflare-pages.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        # Only the public pages. The same script builds the site on Cloudflare Pages.
        run: bash tools/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
